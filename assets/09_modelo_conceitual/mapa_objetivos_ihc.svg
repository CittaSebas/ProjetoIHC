<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" font-family="Arial, sans-serif" font-size="12.5" fill="#222">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#444"/>
    </marker>
  </defs>
  <rect width="960" height="500" fill="#ffffff"/>

  <!-- legenda -->
  <g>
    <rect x="20" y="15" width="280" height="250" fill="#e6e6e6" stroke="#999"/>
    <text x="32" y="36" font-style="italic" font-size="12">Legenda</text>

    <rect x="32" y="50" width="250" height="30" rx="10" fill="#fff" stroke="#444" stroke-width="1.3"/>
    <line x1="80" y1="50" x2="80" y2="80" stroke="#444" stroke-width="1.3"/>
    <text x="56" y="69" text-anchor="middle" font-size="11">papel</text>
    <text x="90" y="69">objetivo final</text>

    <rect x="32" y="90" width="250" height="30" rx="10" fill="#fff" stroke="#444" stroke-width="1.3" stroke-dasharray="5 4"/>
    <line x1="80" y1="90" x2="80" y2="120" stroke="#444" stroke-width="1.3" stroke-dasharray="5 4"/>
    <text x="56" y="109" text-anchor="middle" font-size="11">papel</text>
    <text x="90" y="109">objetivo instrumental</text>

    <line x1="34" y1="142" x2="110" y2="142" stroke="#444" stroke-width="1.3" marker-end="url(#seta)"/>
    <text x="120" y="146" font-style="italic" font-size="11.5">instrumenta diretamente</text>
    <line x1="34" y1="166" x2="110" y2="166" stroke="#444" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#seta)"/>
    <text x="120" y="170" font-style="italic" font-size="11.5">instrumenta indiretamente</text>

    <line x1="32" y1="184" x2="288" y2="184" stroke="#999"/>
    <text x="44" y="206" font-style="italic" font-size="14">Papéis</text>
    <text x="60" y="228">P: professor</text>
    <text x="60" y="248">A: aluno</text>
  </g>

  <!-- áreas -->
  <g fill="none" stroke="#888" stroke-dasharray="2 3">
    <rect x="320" y="15" width="580" height="140"/>
    <rect x="320" y="170" width="580" height="130"/>
    <rect x="320" y="315" width="580" height="70"/>
    <rect x="320" y="400" width="580" height="80"/>
  </g>
  <g font-style="italic" font-size="12" text-anchor="end">
    <text x="892" y="31">trilha</text>
    <text x="892" y="186">tópico</text>
    <text x="892" y="331">grafo de conhecimento</text>
    <text x="892" y="416">fonte</text>
  </g>

  <!-- ligações -->
  <g fill="none" stroke="#444" stroke-width="1.3">
    <!-- O02 instrumenta O01 -->
    <path d="M590 62 H628" marker-end="url(#seta)"/>
    <!-- O01 instrumenta O03 -->
    <path d="M755 84 V98" marker-end="url(#seta)"/>
    <!-- O01 instrumenta O04 e O05 -->
    <path d="M880 62 H920 V268 H882" marker-end="url(#seta)"/>
    <path d="M920 212 H882" marker-end="url(#seta)"/>
    <!-- O07 instrumenta O04 e O05 -->
    <path d="M590 350 H610 V212 H628" marker-end="url(#seta)"/>
    <path d="M610 268 H628" marker-end="url(#seta)"/>
    <!-- O07 instrumenta O06 -->
    <path d="M465 372 V395 H755 V416" marker-end="url(#seta)"/>
    <!-- O08 instrumenta O06 -->
    <path d="M590 440 H628" marker-end="url(#seta)"/>
  </g>

  <!-- objetivos: caixa contínua = final; tracejada = instrumental -->
  <g stroke="#444" stroke-width="1.3">
    <!-- O02 instrumental -->
    <rect x="340" y="40" width="250" height="44" rx="10" fill="#fff" stroke-dasharray="5 4"/>
    <line x1="385" y1="40" x2="385" y2="84" stroke-dasharray="5 4"/>
    <!-- O01 -->
    <rect x="630" y="40" width="250" height="44" rx="10" fill="#fff"/>
    <line x1="675" y1="40" x2="675" y2="84"/>
    <!-- O03 -->
    <rect x="630" y="100" width="250" height="44" rx="10" fill="#fff"/>
    <line x1="675" y1="100" x2="675" y2="144"/>
    <!-- O04 -->
    <rect x="630" y="190" width="250" height="44" rx="10" fill="#fff"/>
    <line x1="675" y1="190" x2="675" y2="234"/>
    <!-- O05 -->
    <rect x="630" y="246" width="250" height="44" rx="10" fill="#fff"/>
    <line x1="675" y1="246" x2="675" y2="290"/>
    <!-- O07 instrumental -->
    <rect x="340" y="328" width="250" height="44" rx="10" fill="#fff" stroke-dasharray="5 4"/>
    <line x1="385" y1="328" x2="385" y2="372" stroke-dasharray="5 4"/>
    <!-- O08 -->
    <rect x="340" y="418" width="250" height="44" rx="10" fill="#fff"/>
    <line x1="385" y1="418" x2="385" y2="462"/>
    <!-- O06 -->
    <rect x="630" y="418" width="250" height="44" rx="10" fill="#fff"/>
    <line x1="675" y1="418" x2="675" y2="462"/>
  </g>

  <!-- papéis -->
  <g text-anchor="middle" font-size="12">
    <text x="362" y="66">A</text>
    <text x="652" y="66">A</text>
    <text x="652" y="126">A</text>
    <text x="652" y="216">P A</text>
    <text x="652" y="272">P A</text>
    <text x="362" y="354">P</text>
    <text x="362" y="444">P A</text>
    <text x="652" y="444">P</text>
  </g>

  <!-- textos dos objetivos -->
  <g>
    <text x="395" y="58"><tspan font-weight="bold">O02</tspan> informar a questão</text>
    <text x="395" y="75">(enunciado ou identificador)</text>

    <text x="685" y="58"><tspan font-weight="bold">O01</tspan> obter a trilha de estudo</text>
    <text x="685" y="75">de uma questão</text>

    <text x="685" y="118"><tspan font-weight="bold">O03</tspan> saber em que ordem</text>
    <text x="685" y="135">estudar os tópicos</text>

    <text x="685" y="208"><tspan font-weight="bold">O04</tspan> entender o que é</text>
    <text x="685" y="225">cada tópico</text>

    <text x="685" y="264"><tspan font-weight="bold">O05</tspan> saber em que capítulo</text>
    <text x="685" y="281">do livro está cada tópico</text>

    <text x="395" y="346"><tspan font-weight="bold">O07</tspan> explorar o grafo</text>
    <text x="395" y="363">de conhecimento</text>

    <text x="395" y="436"><tspan font-weight="bold">O08</tspan> conhecer a fonte</text>
    <text x="395" y="453">usada pelo sistema</text>

    <text x="685" y="436"><tspan font-weight="bold">O06</tspan> conferir as fontes</text>
    <text x="685" y="453">dos tópicos</text>
  </g>
</svg>
