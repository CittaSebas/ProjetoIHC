<svg xmlns="http://www.w3.org/2000/svg" width="775" height="330" viewBox="0 0 775 330" font-family="Verdana, Geneva, sans-serif">
  <style>
    .t { font-size:12px; fill:#111; }
    .p { font-size:12px; fill:#111; }
    .h { font-size:15px; font-weight:bold; fill:#111; }
    .s { font-size:11px; fill:#555; }
    .ar { stroke:#111; stroke-width:1.5; fill:none; marker-end:url(#m); }
  </style>
  <defs><marker id="m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#111"/></marker></defs>
  <rect width="775" height="330" fill="#fff"/>
  <text x="16" y="26" class="h">Mapa individual: grafo e tópico</text>
  <text x="16" y="44" class="s">Juan Manuel Citta. Cenário CI02.</text>
  <rect x="20" y="140" width="195" height="64" rx="8" fill="#fff" stroke="#222" stroke-width="1.5"/>
  <line x1="50" y1="140" x2="50" y2="204" stroke="#222" stroke-width="1.5"/>
  <text x="35.0" y="176.0" class="p" text-anchor="middle">P A</text>
  <text x="58" y="168.0" class="t"><tspan font-weight="bold">O07</tspan> Consultar grafo</text>
  <text x="58" y="184.0" class="t">de conhecimento</text>
  <rect x="290" y="140" width="195" height="64" rx="8" fill="#fff" stroke="#222" stroke-width="1.5"/>
  <line x1="320" y1="140" x2="320" y2="204" stroke="#222" stroke-width="1.5"/>
  <text x="305.0" y="176.0" class="p" text-anchor="middle">P A</text>
  <text x="328" y="168.0" class="t"><tspan font-weight="bold">O04</tspan> Visualizar detalhes</text>
  <text x="328" y="184.0" class="t">do tópico</text>
  <rect x="560" y="70" width="195" height="64" rx="8" fill="#fff" stroke="#222" stroke-width="1.5"/>
  <line x1="590" y1="70" x2="590" y2="134" stroke="#222" stroke-width="1.5"/>
  <text x="575.0" y="106.0" class="p" text-anchor="middle">A</text>
  <text x="598" y="98.0" class="t"><tspan font-weight="bold">O05</tspan> Marcar tópico</text>
  <text x="598" y="114.0" class="t">estudado</text>
  <rect x="560" y="210" width="195" height="64" rx="8" fill="#fff" stroke="#222" stroke-width="1.5"/>
  <line x1="590" y1="210" x2="590" y2="274" stroke="#222" stroke-width="1.5"/>
  <text x="575.0" y="246.0" class="p" text-anchor="middle">P A</text>
  <text x="598" y="238.0" class="t"><tspan font-weight="bold">O06</tspan> Perguntar sobre</text>
  <text x="598" y="254.0" class="t">tópico</text>
  <path d="M215,172.0 L286,172.0" class="ar"/>
  <path d="M485,162.0 L525,162.0 L525,102.0 L556,102.0" class="ar"/>
