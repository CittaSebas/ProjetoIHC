<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="800" viewBox="0 0 1240 800" font-family="Verdana, Geneva, sans-serif">
  <style>
    .scr  { fill:#ffffff; stroke:#444; stroke-width:2.5; }
    .bar  { fill:#ececec; stroke:#444; stroke-width:2; }
    .box  { fill:#f7f7f7; stroke:#777; stroke-width:2; }
    .btn  { fill:#ddd; stroke:#444; stroke-width:2; }
    .ghost{ fill:none; stroke:#aaa; stroke-width:2; stroke-dasharray:5 4; }
    .node { fill:#fff; stroke:#444; stroke-width:2; }
    .nodeHi { fill:#e0e0e0; stroke:#000; stroke-width:3.5; }
    .lbl  { font-size:15px; font-weight:bold; fill:#111; }
    .t    { font-size:12px; fill:#222; }
    .tg   { font-size:12px; fill:#888; }
    .ts   { font-size:11px; fill:#444; }
    .arrow{ stroke:#333; stroke-width:2.5; fill:none; marker-end:url(#a); }
    .acap { font-size:11.5px; fill:#333; font-style:italic; }
  </style>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#333"/>
    </marker>
  </defs>

  <text x="20" y="28" class="lbl" font-size="17">PF01: Descobrir o que estudar a partir de uma questão (T01)</text>
  <text x="20" y="48" class="tg">Protótipo de baixa fidelidade. Equipe 03. Caminho principal: P01 › P03 › P04 › P05. Desvios: P02 (entrada inválida), P06 (falha na geração).</text>

  <!-- ============ P01 ============ -->
  <g transform="translate(20,70)">
    <rect class="scr" width="360" height="290" rx="4"/>
    <rect class="bar" x="0" y="0" width="360" height="32"/>
    <text x="12" y="21" class="t">Trilha de Estudo</text>
    <text x="268" y="21" class="t">Fontes</text>
    <text x="12" y="62" class="lbl">P01: Entrada</text>
    <text x="12" y="84" class="t">Cole o enunciado da questão</text>
    <text x="12" y="100" class="t">ou o identificador do Codeforces.</text>
    <rect class="box" x="12" y="112" width="336" height="110" rx="3"/>
    <text x="22" y="134" class="tg">ex.: 1352A  ou  cole o texto completo</text>
    <text x="22" y="152" class="tg">do enunciado aqui...</text>
    <rect class="btn" x="248" y="234" width="100" height="36" rx="3"/>
    <text x="268" y="257" class="t">Gerar trilha</text>
    <text x="12" y="257" class="ts">Nenhuma outra opção na tela (N01)</text>
  </g>
  <text x="20" y="378" class="acap">Campo único aceita enunciado e identificador. Atende F01 e RC01.</text>

  <!-- ============ P03 ============ -->
  <g transform="translate(440,70)">
    <rect class="scr" width="360" height="290" rx="4"/>
    <rect class="bar" x="0" y="0" width="360" height="32"/>
    <text x="12" y="21" class="t">Trilha de Estudo</text>
    <text x="12" y="62" class="lbl">P03: Processando</text>
    <rect class="box" x="12" y="84" width="336" height="60" rx="3"/>
    <text x="22" y="108" class="t">Lendo o enunciado e identificando</text>
    <text x="22" y="126" class="t">os tópicos...</text>
    <rect class="box" x="12" y="160" width="336" height="18" rx="9"/>
    <rect x="14" y="162" width="150" height="14" rx="7" fill="#bbb"/>
    <text x="12" y="200" class="ts">Costuma levar alguns segundos.</text>
    <rect class="ghost" x="12" y="216" width="336" height="54" rx="3"/>
    <text x="22" y="240" class="tg">(área onde a trilha vai aparecer)</text>
  </g>
  <text x="440" y="378" class="acap">Estado que o CTT não representava. Atende F02 e RC02.</text>

  <!-- ============ P04 ============ -->
  <g transform="translate(860,70)">
    <rect class="scr" width="360" height="290" rx="4"/>
    <rect class="bar" x="0" y="0" width="360" height="32"/>
    <text x="12" y="21" class="t">Trilha de Estudo</text>
    <text x="268" y="21" class="t">Fontes</text>
    <text x="12" y="58" class="lbl">P04: Trilha em grafo</text>
    <text x="12" y="76" class="ts">Comece por aqui › siga as setas</text>

    <circle class="nodeHi" cx="58" cy="118" r="26"/>
    <text x="36" y="122" class="ts">Arrays</text>
    <circle class="node" cx="160" cy="118" r="26"/>
    <text x="134" y="122" class="ts">Ordena.</text>
    <circle class="node" cx="262" cy="118" r="26"/>
    <text x="240" y="122" class="ts">Greedy</text>
    <circle class="node" cx="160" cy="206" r="26"/>
    <text x="136" y="210" class="ts">Prefixo</text>
    <circle class="node" cx="262" cy="206" r="26"/>
    <text x="246" y="210" class="ts">DP</text>

    <line x1="84" y1="118" x2="134" y2="118" class="arrow"/>
    <line x1="186" y1="118" x2="236" y2="118" class="arrow"/>
    <line x1="80" y1="138" x2="138" y2="192" class="arrow"/>
    <line x1="186" y1="206" x2="236" y2="206" class="arrow"/>

    <rect class="btn" x="300" y="98" width="44" height="26" rx="3"/>
    <text x="316" y="116" class="t">+</text>
    <rect class="btn" x="300" y="130" width="44" height="26" rx="3"/>
    <text x="318" y="148" class="t">-</text>
    <text x="12" y="256" class="ts">Toque num tópico para ver a fonte</text>
    <text x="12" y="274" class="ts">e por que ele foi indicado.</text>
  </g>
  <text x="860" y="378" class="acap">Caminho recomendado em destaque. Zoom. Atende F03 e H15.</text>

  <!-- ============ P02 ============ -->
  <g transform="translate(20,420)">
    <rect class="scr" width="360" height="290" rx="4"/>
    <rect class="bar" x="0" y="0" width="360" height="32"/>
    <text x="12" y="21" class="t">Trilha de Estudo</text>
    <text x="12" y="62" class="lbl">P02: Pedido de esclarecimento</text>
    <rect class="box" x="12" y="80" width="336" height="64" rx="3"/>
    <text x="22" y="102" class="tg">asdasd</text>
    <text x="22" y="120" class="ts">(o texto continua no campo)</text>
    <path d="M12,164 h336 v62 h-320 l-16,16 z" fill="#f4f4f4" stroke="#777" stroke-width="2"/>
    <text x="24" y="186" class="t">Não consegui identificar a questão.</text>
    <text x="24" y="204" class="t">Cole o enunciado completo ou o código</text>
    <text x="24" y="222" class="t">do problema, por exemplo 1352A.</text>
    <rect class="btn" x="248" y="244" width="100" height="36" rx="3"/>
    <text x="268" y="267" class="t">Gerar trilha</text>
    <text x="12" y="267" class="ts">Botão continua ativo</text>
  </g>
  <text x="20" y="728" class="acap">Resposta do sistema, não bloqueio. Coerente com a entrada conversacional do recorte 7.4.</text>

  <!-- ============ P06 ============ -->
  <g transform="translate(440,420)">
    <rect class="scr" width="360" height="290" rx="4"/>
    <rect class="bar" x="0" y="0" width="360" height="32"/>
    <text x="12" y="21" class="t">Trilha de Estudo</text>
    <text x="12" y="62" class="lbl">P06: Não foi possível gerar</text>
    <rect x="12" y="84" width="336" height="92" rx="3" fill="#f2f2f2" stroke="#444" stroke-width="2"/>
    <text x="22" y="108" class="t">Não conseguimos montar uma trilha</text>
    <text x="22" y="126" class="t">confiável para esta questão.</text>
    <text x="22" y="150" class="ts">Nada foi perdido: seu texto continua</text>
    <text x="22" y="166" class="ts">no campo acima.</text>
    <rect class="btn" x="12" y="194" width="110" height="36" rx="3"/>
    <text x="30" y="217" class="t">Tentar de novo</text>
    <rect class="btn" x="134" y="194" width="130" height="36" rx="3"/>
    <text x="150" y="217" class="t">Editar o enunciado</text>
    <text x="12" y="256" class="ts">O sistema erra às vezes. Melhor dizer</text>
    <text x="12" y="272" class="ts">isso do que mostrar trilha inventada.</text>
  </g>
  <text x="440" y="728" class="acap">Alucinação registrada no TCC (F1 Macro 0,5820). Recuperação de erro.</text>

  <!-- ============ P05 ============ -->
  <g transform="translate(860,420)">
    <rect class="scr" width="360" height="290" rx="4"/>
    <rect class="bar" x="0" y="0" width="360" height="32"/>
    <text x="12" y="21" class="t">Trilha de Estudo</text>
    <text x="12" y="58" class="lbl">P05: Detalhe do tópico</text>
    <rect class="box" x="12" y="72" width="336" height="200" rx="3"/>
    <text x="24" y="96" class="lbl">Somas de prefixo</text>
    <text x="24" y="122" class="ts">ONDE ESTUDAR</text>
    <text x="24" y="140" class="t">Cormen, Introduction to Algorithms</text>
    <text x="24" y="156" class="t">cap. 4</text>
    <text x="24" y="182" class="ts">POR QUE ESTE TÓPICO</text>
    <text x="24" y="200" class="t">O enunciado pede soma de intervalos</text>
    <text x="24" y="216" class="t">repetidas vezes.</text>
    <text x="24" y="242" class="ts">CONFIANÇA DO SISTEMA</text>
    <rect x="24" y="250" width="120" height="12" rx="6" fill="#ddd" stroke="#555" stroke-width="1.5"/>
    <rect x="25" y="251" width="78" height="10" rx="5" fill="#999"/>
    <text x="154" y="261" class="ts">média</text>
  </g>
  <text x="860" y="728" class="acap">Fonte, motivo e incerteza na mesma tela. Atende F04, F05 e T02.</text>

  <!-- ============ setas entre telas ============ -->
  <line x1="384" y1="200" x2="434" y2="200" class="arrow"/>
  <text x="380" y="192" class="ts">enviar</text>
  <line x1="804" y1="200" x2="854" y2="200" class="arrow"/>
  <text x="806" y="192" class="ts">pronto</text>
  <path d="M200,364 L200,414" class="arrow"/>
  <text x="206" y="392" class="ts">não reconheceu</text>
  <path d="M620,364 L620,414" class="arrow"/>
  <text x="626" y="392" class="ts">falha</text>
  <path d="M1040,364 L1040,414" class="arrow"/>
  <text x="1046" y="392" class="ts">toca num tópico</text>
</svg>
